# Run from the repository root: dataflex-cli train examples/train_lora/lego/llava15.yaml
# Set the model/data paths and register the datasets before running.
# Functional validation only; these are NOT the full reweight paper settings.
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.0
freeze_vision_tower: true
freeze_multi_modal_projector: false
additional_target: multi_modal_projector
template: llava
cutoff_len: 2048
packing: false
streaming: false
val_size: 0
mix_strategy: concat
preprocessing_num_workers: 1
dataloader_num_workers: 0
overwrite_cache: false
use_fast_tokenizer: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.0
weight_decay: 0.0
num_train_epochs: 1.0
bf16: true
flash_attn: disabled
gradient_checkpointing: true
use_reentrant_gc: false
seed: 42
data_seed: 42
full_determinism: true
report_to: none
logging_steps: 1
save_strategy: steps
save_steps: 2
save_total_limit: 4
save_only_model: false
overwrite_output_dir: false
disable_tqdm: true
train_type: dynamic_lego
component_name: multimodal_lego
warmup_step: 0
update_step: 2
update_times: 3
train_step: 6
max_steps: 6

model_name_or_path: /path/to/llava-1.5-7b-hf
dataset: coco_description,coco_short_vqa
eval_dataset: anchors
dataset_dir: /path/to/processed_llava_data
components_cfg_file: examples/train_lora/lego/components.yaml
output_dir: saves/llava15_lego
